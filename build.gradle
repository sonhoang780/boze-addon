import net.fabricmc.loom.task.prod.ClientProductionRunTask

plugins {
    id 'net.fabricmc.fabric-loom'
    // ── Compose GUI spike (ComposeScreen bridge for WhitelistEditorScreen) ──
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.0'
    id 'org.jetbrains.compose' version '1.11.1'
}

// ─── TỰ ĐỘNG XỬ LÝ PHIÊN BẢN (HIỂN THỊ TRONG GAME) ────────────────────────
def getGitCommitHash() {
    try {
        return 'git rev-parse --short HEAD'.execute().text.trim()
    } catch (Exception e) {
        return 'unknown'
    }
}

def rawVersion = System.getenv("GITHUB_REF_NAME")
if (rawVersion != null) {
    if (rawVersion.startsWith("v")) {
        version = "boze-addon-" + rawVersion.substring(1)
    } else {
        version = "boze-addon-" + rawVersion
    }
} else {
    version = "boze-addon-${getGitCommitHash()}"
}
// ────────────────────────────────────────────────────────────────────────

group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    mavenCentral()
    google() // androidx.* transitive deps pulled in by Compose Multiplatform

    maven {
        name = "boze-maven"
        url = "https://maven.boze.dev/releases"
    }
    maven { url = "https://maven.seedfinding.com" }
    maven { url = "https://m2.dv8tion.net/releases" }
    maven { url = "https://maven.lavalink.dev/releases" }
    maven { url = "https://maven.lavalink.dev/snapshots" }
    maven { url = "https://jitpack.io" }
    maven { url = "https://packages.jetbrains.team/maven/p/ui/dev" }

    // Nether Pathfinder (used by Baritone's #elytra pathing)
    maven { url = "https://babbaj.github.io/maven/" }
    // ViaFabricPlus (protocol-translation dev API)
    maven { url = "https://repo.viaversion.com" }
    maven { url = "https://maven.lenni0451.net/everything" }
    maven { url = "https://maven.terraformersmc.com/releases" }
    // MCEF [Keksuccino's Fork] (WebBrowser module) -- no JitPack tag matches this exact
    // build (Keksuccino/mcef's git tags stop at 2.1.6-1.21.1); the 2.1.7-1.21.10-fabric
    // jar only exists as a direct Modrinth-hosted release, pulled via Modrinth's own
    // Maven endpoint (group "maven.modrinth", artifact = project slug).
    maven { url = "https://api.modrinth.com/maven" }

    // patchMcefJar (below) writes its output here under a group-name-version filename
    // so flatDir resolution gives Loom's `include` a real module component to nest
    // (a bare FileCollection dependency isn't a module component and `include` rejects
    // it with "which is not a module component and has no capabilities").
    // Deliberately OUTSIDE layout.buildDirectory: the patch runs eagerly at
    // configuration time (see below), before any task -- including `clean` -- ever
    // executes. `clean` deletes the whole buildDir, so a patched jar living under
    // build/ gets wiped by `gradle clean build` right after this eager block already
    // decided the file exists and skipped re-patching, leaving compileJava with no
    // org.cef/com.cinemamod.mcef classes on the classpath (reproduced: `gradle clean
    // compileJava` -> "package org.cef does not exist" x145). A location clean never
    // touches survives that ordering regardless of task order.
    flatDir { dirs layout.projectDirectory.dir(".gradle-mcef-cache") }
}

configurations {
    bozeLoader
    mcefRaw
    // Resolved and walked eagerly after the dependencies block below to `include()` its full
    // transitive closure -- see the Compose GUI spike dependencies for why.
    composeTransitive {
        exclude group: "org.jetbrains.skiko" // pinned explicitly elsewhere (variant-ambiguity workaround)
    }
}

// mcef-keksuccino 2.2.0-26.1.1-fabric is a REAL Fabric mod (own entrypoint
// com.cinemamod.mcef.MCEFFabric + mcef.mixins.json/mcef.fabric.mixins.json), unlike
// 2.1.7 whose com.cinemamod.mcef.* glue silently failed to link on our real-deobf
// runtime (Yarn-intermediary names) and so never got far enough to self-init. 2.2.0's
// classes DO link now (built for real 26.1.x names), so its entrypoint actually runs
// and calls CefApp.getInstance() with ITS OWN settings on the first Screen open --
// racing our own manual CefUtil.init() and throwing "Settings can only be passed to
// CEF before createClient is called the first time" (reproduced just opening the
// inventory). We only want its plain org.cef.*/com.cinemamod.mcef.* CLASSES, not its
// mod behavior -- this task strips entrypoints/mixins from its fabric.mod.json so
// Fabric Loader still recognizes it as a valid nested mod (keeps id/version) but
// never invokes anything from it.
// Filename follows flatDir's expected "name-version.jar" convention (group is ignored
// by flatDir but still required in the dependency notation below). flatDir resolves
// this by filename lookup at CONFIGURATION time with no task-dependency tracking, so
// the patch must happen eagerly here (during script evaluation), not as a lazy task --
// a lazy task has no way to run before Gradle's own dependency resolution needs the
// file to already exist.
dependencies {
    mcefRaw "maven.modrinth:mcef-keksuccino:2.2.0-26.1.1-fabric"
}
def mcefRawJar = configurations.mcefRaw.singleFile
def mcefPatchedJar = layout.projectDirectory.file(".gradle-mcef-cache/mcef-keksuccino-patched-2.2.0.jar").asFile
if (!mcefPatchedJar.exists() || mcefPatchedJar.lastModified() < mcefRawJar.lastModified()) {
    mcefPatchedJar.parentFile.mkdirs()
    if (mcefPatchedJar.exists()) mcefPatchedJar.delete()
    new java.util.zip.ZipFile(mcefRawJar).withCloseable { zf ->
        new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(mcefPatchedJar)).withCloseable { zos ->
            zf.entries().each { entry ->
                byte[] data = zf.getInputStream(entry).bytes
                if (entry.name == "fabric.mod.json") {
                    def json = new groovy.json.JsonSlurper().parseText(new String(data, "UTF-8"))
                    json.entrypoints = [main: [], client: [], server: []]
                    json.mixins = []
                    data = groovy.json.JsonOutput.toJson(json).getBytes("UTF-8")
                }
                zos.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                zos.write(data)
                zos.closeEntry()
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly "com.github.cabaletta:baritone:1.2.14"
    compileOnly "com.viaversion:viafabricplus-api:4.5.5"
    implementation "com.viaversion:viafabricplus:4.5.5"
    include "com.viaversion:viafabricplus:4.5.5"

    // Fabric API để sửa lỗi thiếu HudRenderCallback và sự kiện Chat
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    include "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // MCEF (WebBrowser module) -- used ONLY for its bundled org.cef.* (JCEF) classes,
    // which are pure Java-over-JNI with ZERO Minecraft references. The jar's own
    // com.cinemamod.mcef.* glue classes are compiled against Yarn INTERMEDIARY names
    // (Fabric 1.21.10 production convention -- CefUtil references net/minecraft/class_310)
    // and can NEVER link on the Boze 26.1.2 runtime (MC 26.x ships real deobfuscated
    // names; hit as NoClassDefFoundError: class_310 in a real runBoze). No remap pipeline
    // exists to fix that at build time either: this Loom fork disables obfuscation for
    // 26.x, so modImplementation/mod-remap configurations are never registered.
    // The classes that DO touch Minecraft types (CefUtil, MCEF, MCEFBrowser, MCEFRenderer,
    // MCEFDirectTexture, MCEFSettings) are VENDORED and ported to 26.1.2 under
    // com.example.addon.modules.webbrowser.mcef -- do not import those from com.cinemamod.mcef.
    // Everything else (MCEFApp, MCEFClient, MCEFPlatform, MCEFDownloader, MCEFDragContext,
    // ModScheme, the listener interfaces) has zero Minecraft-class references and is still
    // used directly from this jar -- verified via `javap`/decompile, not assumed.
    // Raw coordinate is declared earlier (mcefRaw config, resolved eagerly above to
    // produce the patched jar) -- implementation/include here point at that PATCHED
    // jar via flatDir, not this coordinate directly.
    implementation("mcef-keksuccino-patched:mcef-keksuccino-patched:2.2.0") { transitive = false }
    include("mcef-keksuccino-patched:mcef-keksuccino-patched:2.2.0") { transitive = false }
    // MCEFDownloader (reused as-is above) needs these to extract the downloaded JCEF
    // tar.gz -- not otherwise pulled in transitively.
    implementation "org.apache.commons:commons-compress:1.26.0"
    include "org.apache.commons:commons-compress:1.26.0"

    // Boze Dependencies
    compileOnly "dev.boze:boze-api:${project.boze_api_version}+${project.minecraft_version}"
    bozeLoader "dev.boze:boze-loader-beta:${project.boze_loader_version}"
    implementation "meteordevelopment:orbit:${project.orbit_version}"

    def lavaplayerVersion = "2.2.6"
    def jacksonVersion = "2.15.2"
    def ytSourceVersion = "9d4dbeeb51f16d53078486d69d27654d4acfa7fb-SNAPSHOT"
    def rhinoVersion = "1.7.14"
    
    // ─── SKIJA DEPENDENCIES ───────────────────────────────────────
    // Two release lines exist: 0.119.x (legacy Skia m119) and 0.143.x (main, Skia m143).
    // BackendTexture/borrowTextureFrom (Skija PR #116, needed by SkijaBackdropBlur &
    // SkiaPipRenderer) only exists in the 0.143.x line -- 0.119.6 has a NEWER publish
    // date but does NOT contain it. Don't "upgrade" back to 0.119.x.
    def skijaVersion = "0.143.17"
    def typesVersion = "0.2.0"
    
    implementation "io.github.humbleui:types:${typesVersion}"
    include "io.github.humbleui:types:${typesVersion}"
    
    implementation "io.github.humbleui:skija-shared:${skijaVersion}"
    include "io.github.humbleui:skija-shared:${skijaVersion}"
    
    // Core C++ native libraries for cross-platform support (Windows, Linux, macOS)
    implementation "io.github.humbleui:skija-windows-x64:${skijaVersion}"
    include "io.github.humbleui:skija-windows-x64:${skijaVersion}"
    implementation "io.github.humbleui:skija-linux-x64:${skijaVersion}"
    include "io.github.humbleui:skija-linux-x64:${skijaVersion}"
    implementation "io.github.humbleui:skija-macos-x64:${skijaVersion}"
    include "io.github.humbleui:skija-macos-x64:${skijaVersion}"
    implementation "io.github.humbleui:skija-macos-arm64:${skijaVersion}"
    include "io.github.humbleui:skija-macos-arm64:${skijaVersion}"
    // ─────────────────────────────────────────────────────────────

    // ─── COMPOSE GUI SPIKE (ComposeScreen bridge) ──────────────────
    // Fabric Language Kotlin bundles Kotlin stdlib/coroutines as a nested Fabric mod --
    // include (not just implementation) so it's actually present at runtime, same as
    // every other dependency in this file.
    implementation "net.fabricmc:fabric-language-kotlin:1.13.8+kotlin.2.3.0"
    include "net.fabricmc:fabric-language-kotlin:1.13.8+kotlin.2.3.0"

    // skiko is Kotlin-Multiplatform-published (android/awt variants); Loom's plain-Java
    // consumer configs don't carry the KMP attribute schema needed to auto-pick "awt",
    // so pin the concrete jvm/awt artifact + its Windows native runtime explicitly.
    // 0.9.4 was pinned back when compose was 1.8.0; never rechecked after later bumping to
    // 1.11.1 -- ui-text-desktop:1.11.1's own module metadata requires skiko 0.144.6 (verified,
    // not guessed). Mismatch surfaced as a real runtime NoSuchMethodError the moment any
    // Compose text (the search box) actually laid out: setFontEdging(FontEdging) doesn't
    // exist in 0.9.4's TextStyle.
    // EXPERIMENT (skiko-0.150.1-experiment branch): bumping past the version ui-text-desktop:
    // 1.11.1's own module metadata declares (0.144.6) -- "requires" is a Gradle minimum, not a
    // pin, so this resolves fine, but API compat isn't guaranteed (the setFontEdging crash
    // earlier was exactly this kind of gap). Verify a real build + launch before merging.
    def skikoVersion = "0.150.1"
    implementation "org.jetbrains.skiko:skiko-awt:${skikoVersion}"
    include "org.jetbrains.skiko:skiko-awt:${skikoVersion}"
    implementation "org.jetbrains.skiko:skiko-awt-runtime-windows-x64:${skikoVersion}"
    include "org.jetbrains.skiko:skiko-awt-runtime-windows-x64:${skikoVersion}"

    implementation(compose.runtime) { exclude group: "org.jetbrains.skiko" }
    implementation(compose.foundation) { exclude group: "org.jetbrains.skiko" }
    implementation(compose.material) { exclude group: "org.jetbrains.skiko" }
    implementation(compose.ui) { exclude group: "org.jetbrains.skiko" }
    implementation(compose.animation) { exclude group: "org.jetbrains.skiko" }

    // Hand-picking `include()` coordinates one at a time chased a whack-a-mole of
    // NoClassDefFoundError at runtime: org.jetbrains.compose.runtime:runtime-desktop turned
    // out to be a ~5KB shim (real impl is the transitively-pulled androidx.compose.runtime:
    // runtime-desktop:1.11.2, a DIFFERENT maven group), then androidx/compose/ui/unit/DensityKt
    // went missing too (real impl: org.jetbrains.compose.ui:ui-unit-desktop, split out as its
    // own transitive artifact). `implementation` resolves all of this fine for compiling
    // (normal transitive resolution) -- only the hand-written `include()` list was incomplete.
    // Fix (same pattern Veinminer's fabric-script.gradle.kts uses): resolve the FULL transitive
    // closure through a dedicated configuration and `include()` every artifact it contains,
    // instead of guessing coordinates one crash report at a time.
    composeTransitive(compose.runtime)
    composeTransitive(compose.foundation)
    composeTransitive(compose.material)
    composeTransitive(compose.ui)
    composeTransitive(compose.animation)
    // ─────────────────────────────────────────────────────────────

    implementation "commons-logging:commons-logging:1.3.0"
    include "commons-logging:commons-logging:1.3.0"

    implementation "dev.arbjerg:lavaplayer:${lavaplayerVersion}"
    include "dev.arbjerg:lavaplayer:${lavaplayerVersion}"
    implementation "dev.arbjerg:lava-common:${lavaplayerVersion}"
    include "dev.arbjerg:lava-common:${lavaplayerVersion}"
    implementation "dev.arbjerg:lavaplayer-natives:${lavaplayerVersion}"
    include "dev.arbjerg:lavaplayer-natives:${lavaplayerVersion}"

    implementation "dev.lavalink.youtube:common:${ytSourceVersion}"
    include "dev.lavalink.youtube:common:${ytSourceVersion}"

    implementation "org.apache.httpcomponents:httpclient:4.5.14"
    include "org.apache.httpcomponents:httpclient:4.5.14"
    implementation "org.apache.httpcomponents:httpcore:4.4.16"
    include "org.apache.httpcomponents:httpcore:4.4.16"
    implementation "commons-io:commons-io:2.13.0"
    include "commons-io:commons-io:2.13.0"

    implementation "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
    include "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    include "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
    include "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"

    implementation "com.grack:nanojson:1.8"
    include "com.grack:nanojson:1.8"

    implementation "org.mozilla:rhino:${rhinoVersion}"
    include "org.mozilla:rhino:${rhinoVersion}"
    implementation "org.mozilla:rhino-engine:${rhinoVersion}"
    include "org.mozilla:rhino-engine:${rhinoVersion}"

    // ─── MP4 / VIDEO DECODER (JavaCV + FFmpeg, Windows x64 natives only) ──
    // Decodes any codec FFmpeg supports (H.265/HEVC, H.264 High, VP9, AV1…)
    // with hardware acceleration. Natives are bundled — users install nothing.
    // transitive=false on javacv avoids pulling opencv/openblas/etc. presets.
    def javacvVersion = "1.5.11"
    def ffmpegVersion = "7.1-1.5.11"

    implementation("org.bytedeco:javacv:${javacvVersion}") { transitive = false }
    include "org.bytedeco:javacv:${javacvVersion}"

    implementation "org.bytedeco:javacpp:${javacvVersion}"
    include "org.bytedeco:javacpp:${javacvVersion}"
    implementation "org.bytedeco:javacpp:${javacvVersion}:windows-x86_64"
    include "org.bytedeco:javacpp:${javacvVersion}:windows-x86_64"

    implementation "org.bytedeco:ffmpeg:${ffmpegVersion}"
    include "org.bytedeco:ffmpeg:${ffmpegVersion}"
    implementation "org.bytedeco:ffmpeg:${ffmpegVersion}:windows-x86_64"
    include "org.bytedeco:ffmpeg:${ffmpegVersion}:windows-x86_64"
    // ──────────────────────────────────────────────────────────────────────
}

// Eagerly resolve composeTransitive's full closure and `include()` every artifact in it --
// same eager-at-configuration-time approach the mcef patch above uses, for the same reason
// (needs to happen before Loom's own dependency resolution runs, not as a lazy task).
configurations.composeTransitive.resolvedConfiguration.resolvedArtifacts.each { artifact ->
    def id = artifact.moduleVersion.id
    dependencies.add("include", "${id.group}:${id.name}:${id.version}")
}

processResources {
    // Ép file fabric.mod.json đọc biến version tự động cập nhật ở trên
    inputs.property "version", version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.compilerArgs += ['-Xmaxerrs', '10000']
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        // Kotlin's JvmTarget enum has no "25" entry yet, so emit 21 bytecode. This is the
        // OUTPUT class-file version only -- kotlinc still runs on the Java 25 toolchain above.
        // Don't use `kotlin { jvmToolchain(21) }`: that forces the shared JDK toolchain to 21
        // for the WHOLE project, breaking compileJava's `-release 25` ("release version 25 not
        // supported"). 21-target Kotlin and 25-target Java link fine on the same classpath;
        // gradle.properties sets kotlin.jvm.target.validation.mode=warning to allow the gap.
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        // KotlinCompile.createCompilerArguments() does requireNotNull(args.moduleName), which
        // defaults from base.archivesName -- empty in gradle.properties (archives_base_name=)
        // for this project (the real jar name is hardcoded later in the `jar {}` block instead),
        // so the Kotlin-side default resolves to null/blank and throws "Required value was
        // null." Set explicitly rather than relying on that convention chain.
        moduleName = "example-addon"
    }
}

jar {
    // Ép cố định tên file mod chính thức xuất ra
    archiveFileName = "boze-addon.jar"
    archiveVersion = ""
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

tasks.register('copyToMods') {
    // Hardcoded to a specific dev machine's local mods folder -- unconditionally
    // finalizing `build` with this broke every CI run (v1.1.7/v1.1.8): the path
    // doesn't exist on the GitHub Actions runner, so `copy` throws. Skip entirely
    // unless that machine's folder is actually present.
    onlyIf { file('/home/lovey0x/.minecraftx').exists() }
    doLast {
        copy {
            from jar
            into '/home/lovey0x/.minecraftx/instances/boze/mods/'
            rename { 'boze-addon.jar' }
        }
        copy {
            from jar
            into '/home/lovey0x/.minecraftx/instances/26.1.2-fabric0.19.2/mods/'
            rename { 'boze-addon.jar' }
        }
    }
}

build.finalizedBy(copyToMods)

tasks.register("runBoze", ClientProductionRunTask) {
    mods.from configurations.bozeLoader
    // Launching the game is never idempotent -- Gradle must not skip this as
    // UP-TO-DATE (happened intermittently, silently no-op'd the run).
    outputs.upToDateWhen { false }
}