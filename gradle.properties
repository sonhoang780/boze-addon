org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=false

# compileJava targets 25 (java { toolchain }), compileKotlin is capped at 21 (Kotlin's
# JvmTarget enum has no "25" entry yet) -- mismatch is fine at runtime (JVM loads mixed
# class-file versions without issue), just silence Kotlin's strict same-target check.
kotlin.jvm.target.validation.mode=warning

